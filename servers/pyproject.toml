[project]
name = "improve"
version = "0.1.0"
description = "MCP server for improve tools (memory and skill management)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
improve = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
