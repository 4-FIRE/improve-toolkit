[project]
name = "improve"
version = "0.1.0"
description = "MCP server for Improve Toolkit persistent memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.28.1",
]

[project.scripts]
improve = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
